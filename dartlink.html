<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Google Classroom Links</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>Google Classroom</h1>
            <p>Classroom resources and links</p>
        </div>
    </header>

    <main class="container">

        <div class="instructions">
            <strong>Choose a resource:</strong>
            <span>Tap or click a button to open it.</span>
        </div>

        <section class="link-section">

            <h2>Classroom Resources</h2>

            <div class="links">

                <a
                    class="class-link"
                    href="https://classroom.google.com/"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Google Classroom
                    <span class="class-link-description">
                        Open Google Classroom
                    </span>
                </a>


                <a
                    class="class-link"
                    href="https://example.com/assignment1"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Assignment 1
                    <span class="class-link-description">
                        Open Assignment 1
                    </span>
                </a>


                <a
                    class="class-link"
                    href="https://example.com/assignment2"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Assignment 2
                    <span class="class-link-description">
                        Open Assignment 2
                    </span>
                </a>

            </div>

        </section>


        <p>
            <a href="index.html">← Back to Class Links</a>
        </p>

    </main>

    <footer>
        Class resources
    </footer>

</body>

</html>
